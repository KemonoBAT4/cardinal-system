<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{{ page.title }}</title>
        <link rel="icon" type="image/png" href="/_cardinal/icons/cardinal/favicon.ico">
        <link rel="stylesheet" href="/_cardinal/styles/cardinal/index.css">
        <link rel="stylesheet" href="/_cardinal/styles/cardinal/login.css">
    </head>

    <body>
        <main class="login-page">
            <section class="login-container">
                <div class="login-brand">
                    <div class="login-logo">
                        <img src="/_cardinal/icons/cardinal/icon.png" alt="">
                    </div>

                    <div class="login-brand-text">
                        <span class="login-app-name">
                            {{ app_name }}
                        </span>

                        <span class="login-subtitle">
                            Sign in to your account
                        </span>
                    </div>
                </div>

                <div class="login-card">
                    <div class="login-card-header">
                        <span class="login-eyebrow">ACCOUNT ACCESS</span>
                        <h1>Welcome back</h1>
                        <p>Enter your credentials to continue to your account.</p>
                    </div>

                    <form class="login-form" method="POST" action="">
                        <div class="form-field">
                            <label for="username">Username</label>
                            <div class="input-wrapper">
                                <input
                                    type         = "text"
                                    id           = "username"
                                    name         = "username"
                                    placeholder  = "Enter your username"
                                    autocomplete = "username"
                                    required
                                    autofocus
                                >
                            </div>
                        </div>

                        <div class="form-field">
                            <div class="password-label">
                                <label for="password">
                                    Password
                                </label>

                                <a href="/auth/forgot-password">
                                    Forgot password?
                                </a>
                            </div>

                            <div class="input-wrapper">
                                <input
                                    type         = "password"
                                    id           = "password"
                                    name         = "password"
                                    placeholder  = "Enter your password"
                                    autocomplete = "current-password"
                                    required
                                >
                            </div>
                        </div>

                        {% if error %}
                            <div class="login-error">
                                {{ error }}
                            </div>
                        {% endif %}

                        <div class="remember-container">
                            <label class="checkbox-container">
                                <input type="checkbox" name="remember" value="1">
                                <span class="checkmark"></span>
                                <span>Remember me</span>
                            </label>
                        </div>

                        <button type="submit" class="login-button">
                            <span>Sign in</span>
                            <span class="button-arrow">→</span>
                        </button>

                        <div class="register-link">
                            <span>Don't have an account?</span>
                            <a href="/auth/register">
                                Create one
                            </a>
                        </div>

                    </form>

                </div>


                <!-- Footer -->
                <div class="login-footer">
                    <span>Powered by Cardinal</span>

                    <span class="login-version">
                        {{ cardinal_version }}
                    </span>
                </div>
            </section>
        </main>
    </body>
</html>
